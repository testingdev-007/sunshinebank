<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunshine Bank – Careers Fair Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2d42; --coral:#FF6B6B; --blue:#4D96FF; --green:#4CC36A; --yellow:#FFD93D;
  --purple:#9B5DE5; --pink:#FF8FAB; --orange:#FF9F43; --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#fff5cc}
body{
  font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  font-size:clamp(19px,2.4vw,27px); color:var(--ink); line-height:1.25;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 46px,transparent 47px),
    radial-gradient(circle at 17% 16%,rgba(255,255,255,.9) 0 36px,transparent 37px),
    radial-gradient(circle at 84% 10%,rgba(255,255,255,.85) 0 40px,transparent 41px),
    radial-gradient(circle at 89% 12%,rgba(255,255,255,.85) 0 30px,transparent 31px),
    linear-gradient(#a9e2ff 0%,#d8f3ff 45%,#fff5cc 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
button:focus-visible{outline:5px solid var(--blue);outline-offset:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;max-width:1100px;margin:0 auto}
.pill{background:#fff;border-radius:999px;padding:8px 18px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-weight:600;white-space:nowrap}
button.pill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
main{max-width:1100px;margin:0 auto;padding:4px 16px 60px}
.btn{border-radius:26px;padding:16px 30px;font-weight:700;font-size:1.1em;background:var(--green);color:#fff;
  box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--blue)} .btn.warm{background:var(--orange)} .btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
h1,h2,h3{margin:.2em 0;line-height:1.1}
h2{font-size:1.7em;text-align:center}

/* HOME */
.hero{text-align:center;padding:10px 0 4px}
.hero .sun{font-size:clamp(70px,12vw,130px);animation:spin 18s linear infinite;display:inline-block}
.hero h1{font-size:clamp(50px,9vw,100px);color:var(--coral);
  text-shadow:0 5px 0 #fff,0 9px 0 rgba(0,0,0,.12);letter-spacing:1px}
.hero .tag{font-size:1.4em;font-weight:600;margin:.2em 0 .6em}
.bankpic{font-size:clamp(60px,10vw,110px);line-height:1}
.ages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin:18px 0 26px}
.age{background:var(--c);color:#fff;border-radius:34px;padding:22px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 10px 0 rgba(0,0,0,.18);transition:transform .1s;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.age:hover{transform:translateY(-4px) rotate(-1deg)}
.age:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.age .em{font-size:3.6em;line-height:1.1;text-shadow:none}
.age b{font-size:1.9em}
.age span.nm{font-size:1.15em;font-weight:600}
.age span.st{font-size:.8em;opacity:.95;font-weight:500}
.link{display:block;margin:6px auto;font-weight:600;text-decoration:underline;font-size:.9em}

/* JOB BOARD */
.boardhead{text-align:center;margin:6px 0 16px}
.boardhead .em{font-size:3em}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.job{background:#fff;border-radius:32px;padding:20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.12);border:6px solid var(--c);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s;position:relative}
.job:hover{transform:translateY(-4px)}
.job:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.job .em{font-size:4em;line-height:1.1}
.job .t{font-size:1.35em;font-weight:700;color:var(--c)}
.job .r{font-size:.8em;background:#f3f3fb;border-radius:999px;padding:4px 14px}
.job .done{position:absolute;top:-14px;right:-10px;background:var(--yellow);border-radius:999px;padding:6px 12px;font-size:.85em;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15);transform:rotate(8deg)}
.certcta{text-align:center;margin-top:28px}

/* GAME */
.gtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.jobtag{background:var(--c);color:#fff;border-radius:999px;padding:8px 20px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.dots{display:flex;gap:10px}
.dot{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #d9dbe8}
.dot.done{background:var(--yellow);border-color:#f0b800}
.dot.now{border-color:var(--c);transform:scale(1.2)}
.prompt{background:#fff;border-radius:30px;padding:18px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 0 rgba(0,0,0,.1);margin-bottom:18px}
.speak{font-size:1.6em;background:var(--yellow);border-radius:50%;width:2.1em;height:2.1em;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ptext{font-size:1.45em;font-weight:600}
.ptext small{font-size:.65em;font-weight:500;opacity:.85}
.big{font-size:1.5em;color:var(--coral);font-weight:700}
.area{background:rgba(255,255,255,.65);border-radius:30px;padding:20px;min-height:200px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px}
.ctrls{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:20px}
.fb{margin-top:18px}
.fbgood,.fbbad{border-radius:28px;padding:18px 22px;text-align:center;font-size:1.1em;animation:pop .35s ease-out}
.fbgood{background:#dcffe4;border:5px solid var(--green)}
.fbbad{background:#fff1d6;border:5px solid var(--orange)}
.fbhead{font-size:1.5em;font-weight:700;margin-bottom:4px}
.fbgood .btn,.fbbad .btn{margin-top:14px}

/* MONEY */
.coin{display:inline-block;width:var(--d);height:var(--d);filter:drop-shadow(0 5px 0 rgba(0,0,0,.22));flex:none;vertical-align:middle}
.coin .face{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-weight:700}
.coin .lbl{display:flex;align-items:center;justify-content:center;line-height:1}
.cu .face{background:radial-gradient(circle at 35% 30%,#ffc999,#d27a3d 55%,#9a4a1c)} .cu .lbl{color:#3b1606}
.ag .face{background:radial-gradient(circle at 35% 30%,#ffffff,#cfd4dc 55%,#8f97a3)} .ag .lbl{color:#2b2d42}
.au .face{background:radial-gradient(circle at 35% 30%,#fff3b0,#e6b93c 55%,#a87a12)}
.au .lbl{background:radial-gradient(circle at 35% 30%,#fff,#cfd4dc 60%,#9aa1ab);border-radius:50%;width:64%;height:64%;color:#2b2d42}
.bi .face{background:radial-gradient(circle at 35% 30%,#ffffff,#cfd4dc 55%,#8f97a3);border-radius:50%}
.bi .lbl{background:radial-gradient(circle at 35% 30%,#fff3b0,#e6b93c 55%,#a87a12);border-radius:50%;width:68%;height:68%;color:#2b2d42}
.note{display:inline-flex;align-items:center;justify-content:center;width:var(--w);height:calc(var(--w)*.54);background:var(--c);border-radius:12px;
  box-shadow:0 5px 0 rgba(0,0,0,.22);position:relative;flex:none;vertical-align:middle}
.note::before{content:"";position:absolute;inset:7px;border:3px dashed rgba(255,255,255,.7);border-radius:8px}
.note span{color:#fff;font-weight:700;font-size:calc(var(--w)*.26);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.moneybtn{border-radius:20px;padding:8px;transition:transform .1s}
.moneybtn:hover{transform:translateY(-3px) scale(1.04)}
.moneybtn:active{transform:scale(.92)}
.moneybtn.gone{visibility:hidden}

/* PIGGY */
.piggyrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:30px}
.targetbox{background:#fff;border-radius:26px;padding:12px 18px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.numeral{font-size:3.4em;font-weight:700;color:var(--coral);line-height:1}
.tenframe{display:grid;grid-template-columns:repeat(5,34px);gap:6px;margin-top:8px;padding:8px;background:#f3f3fb;border-radius:12px}
.tenframe i{width:34px;height:34px;border-radius:50%;border:3px solid #c9cbe0;background:#fff}
.tenframe i.on{background:var(--coral);border-color:#d94c4c}
.pig{position:relative;width:min(300px,70vw)}
.pig svg{width:100%;height:auto;display:block}
.pig .cnt{position:absolute;left:46%;top:56%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;width:2.6em;height:2.6em;
  display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pig.wiggle{animation:wiggle .35s}

/* JARS */
.jar{width:min(300px,42vw);min-height:250px;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(220,245,255,.8));border:6px solid #9fd8f0;
  border-radius:24px 24px 44px 44px;padding:18px 12px 14px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:6px;position:relative;
  box-shadow:0 8px 0 rgba(0,0,0,.1)}
.jar::before{content:"";position:absolute;top:-22px;left:14%;right:14%;height:20px;background:var(--c);border-radius:10px 10px 4px 4px}
.jar:active{transform:scale(.96)}

/* CUSTOMER */
.customer{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.cem{font-size:4.2em;line-height:1;animation:bob 2.4s ease-in-out infinite}
.bubble{background:#fff;border-radius:26px;padding:14px 22px;font-size:1.25em;font-weight:600;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.bubble::before{content:"";position:absolute;left:-18px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:18px solid #fff;border-left:0}
.tray{min-height:130px;background:#ffe9a8;border:5px dashed #e0b23c;border-radius:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px}
.trayhint{opacity:.6;font-weight:500}
.total{text-align:center;font-size:1.3em;margin:12px 0;font-weight:600}
.total b{color:var(--coral);font-size:1.25em}

/* SEQUENCE */
.slots{display:grid;gap:10px;margin-bottom:18px}
.slot{background:#fff;border:4px dashed #c9cbe0;border-radius:20px;padding:12px 16px;min-height:64px;display:flex;align-items:center;gap:14px;font-weight:600}
.slot .n{background:var(--c);color:#fff;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;flex:none}
.slot.filled{border-style:solid;border-color:var(--green);animation:pop .3s}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{background:var(--c);color:#fff;border-radius:22px;padding:16px;font-weight:600;font-size:1.05em;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:left}
.step:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.step.used{visibility:hidden}

/* CHOICES */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:16px}
.choice{background:#fff;border:5px solid var(--c);border-radius:24px;padding:18px 10px;font-size:1.45em;font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.12)}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.scene{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px;font-size:1.1em}
.tagprice{background:#fff;border-radius:14px;padding:8px 16px;font-weight:700;border:4px solid var(--coral);transform:rotate(-4deg);font-size:1.2em}
.itemem{font-size:4em;line-height:1}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan{background:#fff;border-radius:20px;padding:14px;text-align:center;font-weight:600;border:4px solid #e3e4f0}

/* PHONE */
.phone{width:min(360px,86vw);margin:0 auto;background:#2b2d42;border-radius:42px;padding:16px 12px 22px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.screen{background:#eef3ff;border-radius:30px;padding:16px;min-height:200px}
.from{font-size:.8em;font-weight:700;opacity:.7;margin-bottom:8px}
.msg{background:#fff;border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:1.05em;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.safebtns{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:20px}
.safebtns .btn{font-size:1.3em;min-width:200px}
.btn.red{background:var(--coral)}

/* BADGE + CERT */
.badgewrap{text-align:center;padding:10px}
.rosette{width:220px;height:220px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,var(--c) 56%);
  display:flex;align-items:center;justify-content:center;font-size:6em;box-shadow:0 0 0 12px var(--yellow),0 12px 0 12px rgba(0,0,0,.12);animation:popspin .8s ease-out}
.starsrow{font-size:2.2em;letter-spacing:4px;margin:10px 0}
.starsrow .off{filter:grayscale(1);opacity:.3}
.career{background:#fff;border-radius:28px;padding:18px 22px;max-width:720px;margin:16px auto;box-shadow:0 8px 0 rgba(0,0,0,.1);text-align:left;display:flex;gap:16px;align-items:center}
.career .em{font-size:3em}
.cert{background:#fffdf3;border:12px solid var(--yellow);outline:6px dashed var(--orange);outline-offset:-26px;border-radius:30px;padding:40px 30px;text-align:center;max-width:820px;margin:10px auto;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.cert h1{color:var(--coral);font-size:2.4em}
.cert .who{font-size:2.6em;font-weight:700;color:var(--purple);border-bottom:4px solid #e3d6fb;display:inline-block;min-width:60%;padding:0 10px;margin:8px 0}
.cert .badges{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0;font-size:2.6em}
.nameinput{font:inherit;font-size:1.3em;padding:12px 20px;border-radius:20px;border:5px solid var(--blue);width:min(420px,90%);text-align:center}

/* GROWN-UPS */
.gu{background:#fff;border-radius:28px;padding:20px 24px;margin:16px 0;box-shadow:0 8px 0 rgba(0,0,0,.08);font-size:.82em;line-height:1.45;border-left:14px solid var(--c)}
.gu h3{font-size:1.5em;color:var(--c)}
.gu ul{margin:.4em 0;padding-left:1.2em}
.gu li{margin:.25em 0}

/* FX */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes popspin{0%{transform:scale(0) rotate(-180deg)}80%{transform:scale(1.1) rotate(10deg)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.04)}75%{transform:rotate(5deg) scale(1.04)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
.confetti{position:fixed;top:-20px;width:14px;height:20px;border-radius:4px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.locked .moneybtn,.locked .choice,.locked .jar,.locked .step,.locked .safebtns .btn{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <button class="pill" id="homeBtn">🏠 Home</button>
  <div class="pill" id="starPill">⭐ 0</div>
  <button class="pill" id="soundBtn" aria-label="Sound on or off">🔊 Sound on</button>
</div>
<main id="app"></main>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const fmt = p => p < 100 ? p + 'p' : (p % 100 === 0 ? '£' + (p/100) : '£' + (p/100).toFixed(2));
const strip = h => h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();

let state = { band:null, badges:{}, stars:0, sound:true };
let cur = null, qid = 0;

/* ---------- sound + voice ---------- */
let actx = null;
function tone(f,d,type='sine',vol=.15,delay=0){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx = {
  coin(){tone(1320,.12,'triangle',.12);tone(1760,.18,'triangle',.08,.06)},
  yes(){tone(660,.15,'sine',.18);tone(880,.15,'sine',.18,.12);tone(1320,.3,'sine',.15,.24)},
  no(){tone(260,.18,'triangle',.12);tone(200,.25,'triangle',.1,.12)},
  tap(){tone(520,.06,'square',.04)}
};
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
function speakable(t){
  return strip(t)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/£(\d+)\.(\d\d)/g,(m,a,b)=>`${a} pound${a==='1'?'':'s'} ${+b}`)
    .replace(/\b1p\b/g,'1 penny').replace(/(\d+)p\b/g,'$1 pence')
    .replace(/–/g,' to ');
}
function say(t){
  if(!state.sound || !t) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speakable(t));
    u.lang = 'en-GB'; u.rate = .92; u.pitch = 1.1;
    const v = voices.find(v=>v.lang==='en-GB') || voices.find(v=>/^en/.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
$('#soundBtn').onclick = () => {
  state.sound = !state.sound;
  $('#soundBtn').textContent = state.sound ? '🔊 Sound on' : '🔇 Sound off';
  if(!state.sound){ try{speechSynthesis.cancel()}catch(e){} } else sfx.tap();
};
$('#homeBtn').onclick = () => { sfx.tap(); clearTimeout(cur&&cur.timer); state.band ? renderBoard() : renderHome(); };
function updStars(){ $('#starPill').textContent = '⭐ ' + state.stars; }

function confetti(n=40){
  const cols=['#FF6B6B','#4D96FF','#4CC36A','#FFD93D','#9B5DE5','#FF8FAB','#FF9F43'];
  for(let i=0;i<n;i++){
    const c=document.createElement('span'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=pick(cols);
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3800);
  }
}

/* ---------- money drawing ---------- */
const COINS = {
  1:{l:'1p',s:.62,k:'cu'}, 2:{l:'2p',s:.84,k:'cu'}, 5:{l:'5p',s:.55,k:'ag'}, 10:{l:'10p',s:.76,k:'ag'},
  20:{l:'20p',s:.68,k:'ag',sh:7}, 50:{l:'50p',s:.88,k:'ag',sh:7}, 100:{l:'£1',s:.74,k:'au',sh:12}, 200:{l:'£2',s:.9,k:'bi'},
  500:{l:'£5',note:'#26a98f'}, 1000:{l:'£10',note:'#ee8222'}, 2000:{l:'£20',note:'#8e5bd6'}
};
function poly(n){
  const p=[]; for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n; p.push(`${(50+50*Math.cos(a)).toFixed(1)}% ${(50+50*Math.sin(a)).toFixed(1)}%`)}
  return `polygon(${p.join(',')})`;
}
function money(v,base=110){
  const c=COINS[v];
  if(c.note) return `<span class="note" style="--w:${Math.round(base*1.6)}px;--c:${c.note}"><span>${c.l}</span></span>`;
  const d=Math.round(base*c.s);
  const shape=c.sh?`clip-path:${poly(c.sh)};`:'border-radius:50%;';

/* number distractors */
function distract(ans,steps,min=1){
  const set=new Set(); for(const s of shuffle(steps)){ const v=ans+s; if(v>=min && v!==ans) set.add(v); if(set.size>=3) break; }
  return shuffle([ans,...[...set].slice(0,3)]);
}

function startJob(id){ cur={id,job:JOBS[id],i:0,stars:0}; nextQ(); }
function nextQ(){
  clearTimeout(cur.timer);
  if(cur.i>=5) return finishJob();
  cur.answered=false; cur.tries=0; qid++;
  const q=cur.job.gen(cur.i); cur.q=q;
  const b=band();
  app.innerHTML=`<section>
    <div class="gtop"><div class="jobtag">${cur.job.emoji} ${cur.job.title}</div>
      <div class="dots">${[0,1,2,3,4].map(k=>`<span class="dot ${k<cur.i?'done':k===cur.i?'now':''}"></span>`).join('')}</div></div>
    <div class="prompt"><button class="speak" aria-label="Read it to me">🔊</button><div class="ptext">${q.prompt}</div></div>
    <div class="area" id="area"></div>
    <div class="fb" id="fb"></div>
  </section>`;
  $('.speak').onclick=()=>say(q.speak||q.prompt);
  q.render($('#area'),api);
  if(b.id!=='ks2') setTimeout(()=>say(q.speak||q.prompt),250);
  window.scrollTo(0,0);
}
const api={
  answered:()=>cur.answered,
  right:m=>finishQ(true,m),
  lose:m=>finishQ(false,m),
  wrong(m,el){
    if(cur.answered) return; cur.tries++; sfx.no();
    $('#fb').innerHTML=`<div class="fbbad"><div class="fbhead">🤔 Nearly!</div><div>${m}</div></div>`;
    say('Nearly! '+m);
    if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  }
};
function finishQ(ok,m){
  if(cur.answered) return; cur.answered=true;
  const star=ok&&cur.tries===0;
  if(star){ cur.stars++; state.stars++; updStars(); }
  ok ? (sfx.yes(), confetti(24)) : sfx.no();
  const head = ok ? pick(PRAISE) : 'Good try!';
  $('#area').classList.add('locked');
  $('#fb').innerHTML=`<div class="${ok?'fbgood':'fbbad'}"><div class="fbhead">${ok?(star?'⭐ ':'👍 '):'💡 '}${head}</div><div>${m}</div>
    <button class="btn next">${cur.i===4?'Finish 🏁':'Next ➡️'}</button></div>`;
  say(head+' '+m);
  const go=()=>{ sfx.tap(); cur.i++; nextQ(); };
  $('.next').onclick=go;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  if(state.band==='eyfs'&&ok){ const my=qid; cur.timer=setTimeout(()=>{ if(my===qid) go(); },3800); }
}
function finishJob(){
  const j=cur.job, b=band();
  state.badges[cur.id]=Math.max(cur.stars, state.badges[cur.id]||0);
  confetti(70); sfx.yes();
  app.innerHTML=`<section class="badgewrap">
    <h2>You earned a badge! 🎉</h2>
    <div class="rosette" style="--c:${b.color}">${j.emoji}</div>
    <h2 style="color:${b.color}">${j.title}</h2>
    <div class="starsrow">${[0,1,2,3,4].map(k=>`<span class="${k<cur.stars?'':'off'}">⭐</span>`).join('')}</div>
    <div class="career"><span class="em">💼</span><div><b>Real job: ${j.real}</b><br>${j.fact}</div></div>
    <div class="ctrls"><button class="btn alt" id="back">🧭 Pick another job</button></div>
  </section>`;
  say(`You earned the ${j.title} badge! In real life, ${j.fact}`);
  $('#back').onclick=()=>{ sfx.tap(); renderBoard(); };
  window.scrollTo(0,0);
}
function renderCert(){
  const b=band();
  const realJobs=b.jobs.map(id=>JOBS[id].real);
  app.innerHTML=`<section>
    <div style="text-align:center;margin-bottom:14px"><input class="nameinput" id="nm" maxlength="20" placeholder="Type your name ✏️" autocomplete="off"></div>
    <div class="cert">
      <div style="font-size:3em">🏆</div>
      <h1>Sunshine Bank Star</h1>
      <p style="font-size:1.1em">This certificate is for</p>
      <div class="who" id="who">a Bank Superstar</div>
      <p style="font-size:1.1em">who did brilliant work at Sunshine Bank as a<br><b>${realJobs.join(', ').replace(/, ([^,]*)$/,' and $1')}</b>!</p>
      <div class="badges">${b.jobs.map(id=>JOBS[id].emoji).join('')}</div>
      <p style="font-size:1.4em;font-weight:700">⭐ ${b.jobs.reduce((s,id)=>s+(state.badges[id]||0),0)} stars</p>
      <p style="font-size:.85em;opacity:.8">📸 Ask a grown-up to take a photo!</p>
    </div>
    <div class="ctrls"><button class="btn alt" id="more">🧭 Back to jobs</button><button class="btn warm" id="newp">🔄 New player</button></div>
  </section>`;
  confetti(90); sfx.yes(); say('Well done! You are a Sunshine Bank Star!');
  $('#nm').oninput=e=>{ $('#who').textContent=e.target.value.trim()||'a Bank Superstar'; };
  $('#more').onclick=()=>{ sfx.tap(); renderBoard(); };
  $('#newp').onclick=()=>{ state.badges={}; state.stars=0; updStars(); renderHome(); };
  window.scrollTo(0,0);
}
function renderGrownups(){
  document.body.style.setProperty('--c','#3D86F5');
  app.innerHTML=`<section>
    <h2>👩‍🏫 For grown-ups</h2>
    <div class="gu" style="--c:#555">
      <b>How it works:</b> pick an age, then do 3 short "jobs" of 5 questions each (about 2–3 minutes per job). Every job links to a real career. Finish all 3 for a certificate, then press <b>New player</b> for the next child.
      Instructions are read aloud for ages 4–7 (tap 🔊 to repeat). Use the 🔊 Sound button in a noisy hall. Works best on a tablet.
    </div>
    <div class="gu" style="--c:#FF6F9C"><h3>🐣 Ages 4–5 · Reception (EYFS)</h3>
      Built around the statutory Early Learning Goals for maths: understanding number to 10, and comparing quantities up to 10 (more / fewer). Knowing coin values is <i>not</i> an EYFS goal, so money is a play context here. No reading needed.
      <ul><li><b>Piggy Bank Filler</b> – count out up to 10 coins; a ten-frame shows the target amount.</li>
      <li><b>Coin Matcher</b> – visual matching by colour, size and shape; names each coin aloud.</li>
      <li><b>More or Fewer?</b> – compare two jars of coins.</li></ul></div>
    <div class="gu" style="--c:#3D86F5"><h3>🦊 Ages 5–7 · Key Stage 1</h3>
      <ul><li><b>Coin Expert</b> – Y1 maths: recognise and know the value of coins and notes (including "big coins aren't always worth more").</li>
      <li><b>Bank Teller</b> – Y2 maths: £ and p symbols, combine coins to make an amount up to 99p.</li>
      <li><b>Robot Coder</b> – KS1 computing: algorithms are precise, ordered instructions; spot what comes next.</li></ul></div>
    <div class="gu" style="--c:#8A4FE0"><h3>🚀 Ages 7–11 · Key Stage 2</h3>
      <ul><li><b>Change Maker</b> – Y3+ maths: subtract money to give change, building up to £10 with pounds and pence.</li>
      <li><b>Savings Planner</b> – multiplication, division and halving in saving contexts; comparing two plans.</li>
      <li><b>Scam Spotter</b> – KS2 computing (online safety): spot unsafe messages, never share PINs, passwords or addresses, and tell a trusted adult.</li></ul>
      Financial education in primary schools is getting more attention: the Curriculum and Assessment Review (November 2025) recommended making citizenship, including financial education, compulsory in primary schools.</div>
    <div class="ctrls"><button class="btn alt" id="bk">⬅️ Back</button></div>
  </section>`;
  $('#bk').onclick=renderHome;
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hired! The Career Dice Game</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--panel:#131a31;--panel2:#1c2546;--ink:#eef2ff;--mute:#94a0c4;--you:#2dd4bf;--ai:#fb7185;--gold:#fbbf24;--line:#283463}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1000px 600px at 15% -10%,#22307000,#0a0f1f),radial-gradient(800px 500px at 100% 0%,#3b1f6a55,transparent),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.app{max-width:860px;margin:0 auto;padding:10px 12px 170px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.45rem}
.logo span{color:var(--gold)}
.mode{font-size:.7rem;color:var(--mute);margin-left:6px;font-family:Inter;font-weight:600}
.ib{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1.05rem}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:left;transition:.2s}
.pill.on.p0{border-color:var(--you);box-shadow:0 0 22px #2dd4bf30}
.pill.on.p1{border-color:var(--ai);box-shadow:0 0 22px #fb718530}
.pill .row{display:flex;justify-content:space-between;align-items:center}
.pill .nm{font-weight:800;font-size:.9rem}
.pill .pts{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.secs{display:flex;gap:4px;margin-top:4px;align-items:center}
.sec{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.72rem;background:#ffffff10;filter:grayscale(1);opacity:.35;position:relative}
.sec.got{filter:none;opacity:1}
.sec b{position:absolute;right:-4px;top:-5px;font-size:.55rem;background:#fff;color:#000;border-radius:6px;padding:0 3px}
.ladder{display:flex;gap:3px;margin-top:5px}
.rung{flex:1;height:8px;border-radius:4px;background:#ffffff14}
.rung.done.p0{background:var(--you)}.rung.done.p1{background:var(--ai)}
.rung.cur{background:repeating-linear-gradient(45deg,#ffffff30 0 4px,#ffffff10 4px 8px)}
.rlab{font-size:.65rem;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oldstatus{text-align:center;font-weight:800;font-size:1.05rem;margin:6px 0 10px;min-height:1.4em}
.status small{display:block;font-weight:500;color:var(--mute);font-size:.78rem;margin-top:2px}
.status.ai{color:var(--ai)}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:760px){.board.m4{grid-template-columns:repeat(4,1fr)}}
.job{background:#f8fafc;color:#0f172a;border-radius:16px;overflow:hidden;text-align:left;position:relative;border:3px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.job .hd{background:var(--c);color:#fff;padding:5px 8px;font-size:.66rem;font-weight:800;display:flex;justify-content:space-between;align-items:center;letter-spacing:.3px}
.stars{letter-spacing:1px;font-size:.7rem}
.stars i{font-style:normal;opacity:.35}
.job .tt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.98rem;padding:6px 8px 4px;line-height:1.1;min-height:2.3em}
.job.can{cursor:pointer;box-shadow:0 0 0 2px #fbbf24aa}
.job.can:hover{transform:translateY(-2px)}
.job.focus{border-color:var(--gold);box-shadow:0 0 24px #fbbf2466}
.job.aifocus{border-color:var(--ai);box-shadow:0 0 24px #fb718566}
.job.dead{opacity:.55}
.rqs{display:flex;flex-direction:column;gap:4px;padding:0 6px 6px}
.rq{display:flex;justify-content:space-between;align-items:center;background:#e8edf5;border-radius:10px;padding:5px 7px;border:2px solid transparent;font-size:1.05rem;min-height:32px}
@media(max-width:520px){.rq{padding:3px 6px;font-size:.92rem;min-height:28px}.job .tt{font-size:.9rem;min-height:2.2em}.perk{padding:5px 7px}}
.rq .ic span{opacity:.28;filter:grayscale(.6)}
.rq .ic span.f{opacity:1;filter:none}
.rq .v{font-size:.7rem;font-weight:800;color:#475569;display:flex;gap:4px;align-items:center}
.rq.o0{background:#99f6e4}.rq.o1{background:#fecdd3}
.rq.o0 .ic span,.rq.o1 .ic span{opacity:1;filter:none}
.rq.cur{border-color:#0284c7;background:#e0f2fe}
.rq.tap{cursor:pointer}
.tok{width:14px;height:14px;border-radius:50%;display:inline-block}
.tok.p0{background:#0d9488}.tok.p1{background:#e11d48}
.perk{margin-top:auto;font-size:.68rem;font-weight:700;color:#4338ca;background:#eef2ff;padding:6px 8px;display:flex;justify-content:space-between;gap:4px;cursor:pointer}
.perk span{opacity:.6}
.tray{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 10px;margin-bottom:10px}
.tray .lbl{font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.dice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:66px;align-items:center;margin:8px 0}
.die{width:58px;height:58px;border-radius:14px;background:linear-gradient(160deg,#fff,#dfe5f0);color:#000;font-size:1.75rem;display:grid;place-items:center;box-shadow:0 4px 0 #8391b3,0 6px 14px #0006;position:relative}
.die.tap{cursor:pointer}
.die.ok{box-shadow:0 4px 0 #b45309,0 0 0 3px var(--gold)}
.die.dim{opacity:.4}
.die.sm{width:36px;height:36px;font-size:1.05rem;border-radius:10px;box-shadow:0 2px 0 #8391b3}
.die.tumble{animation:tumble .55s ease-out}
@keyframes tumble{0%{transform:translateY(-30px) rotate(-260deg) scale(.6);opacity:.2}70%{transform:translateY(4px) rotate(10deg)}100%{transform:none;opacity:1}}
.locked{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:38px;align-items:center}
.empty{color:var(--mute);font-size:.8rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,#0a0f1fee 22%);padding:22px 12px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto}
.meter{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;margin-bottom:8px;color:var(--mute)}
.meter .track{flex:1;height:10px;border-radius:5px;background:#ffffff14;overflow:hidden}
.meter .fill{height:100%;border-radius:5px;transition:width .3s}
.stake{color:var(--gold)}
.btns{display:flex;gap:8px}
.big{flex:1;padding:15px 10px;border-radius:16px;font-weight:800;font-size:1.05rem;transition:transform .08s,opacity .2s}
.big:active{transform:scale(.97)}
.big:disabled{opacity:.25;cursor:not-allowed}
.roll{background:var(--you);color:#042f2a;box-shadow:0 5px 0 #0f766e}
.bank{background:var(--gold);color:#3a2600;box-shadow:0 5px 0 #b45309}
.ticker{margin-top:10px;font-size:.74rem;color:var(--mute);text-align:center;line-height:1.6}
.ticker b.p0{color:var(--you)}.ticker b.p1{color:var(--ai)}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oh{grid-column:1/-1;text-align:center;color:var(--mute);font-size:.8rem;font-weight:700}
.rival{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.78rem;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:center}
.rival .mini{display:flex;gap:4px;flex-wrap:wrap}
.mini span{background:#ffffff12;border-radius:6px;padding:1px 5px}
.mini span.o1{background:#fb718555;color:#fff}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.box h2{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:1.4rem}
.box p{color:#cbd3ee;font-size:.9rem;line-height:1.45;margin:6px 0}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-size:.9rem;line-height:1.35;color:#dbe2f7}
.steps li .e{font-size:1.3rem;width:30px;flex:none;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend span{background:var(--panel2);border-radius:9px;padding:5px 8px;font-size:.78rem}
.modes{display:grid;gap:10px;margin-top:12px}
.mt{display:flex;gap:12px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;transition:.15s}
.mt:hover{border-color:var(--gold);transform:translateY(-2px)}
.mt .e{font-size:2rem}
.mt b{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;display:block}
.mt small{color:var(--mute);font-size:.8rem;line-height:1.3;display:block}
.tag{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#ffffff18;margin-left:6px;vertical-align:middle;font-family:Inter}
.go{background:var(--you);color:#042f2a;font-weight:800;padding:13px 18px;border-radius:14px;width:100%;margin-top:8px;font-size:1rem}
.ghost{background:var(--panel2);border:1px solid var(--line);font-weight:700;padding:11px 16px;border-radius:12px}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.9rem;text-align:center;background:#000d;padding:14px 26px;border-radius:20px;animation:pop 1.5s forwards;max-width:90vw}
.toast small{display:block;font-size:1rem;color:var(--gold);margin-top:2px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0}}
.mini-toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000e;padding:8px 14px;border-radius:12px;font-size:.85rem;z-index:61;animation:pop2 1.3s forwards;pointer-events:none}
@keyframes pop2{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
table.sc{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
table.sc td,table.sc th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.chip{display:inline-block;font-size:.7rem;padding:3px 8px;border-radius:999px;color:#fff;margin:2px;font-weight:700}

.coach{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:1.02rem;line-height:1.3;text-align:center;margin-bottom:8px}
.coach small{display:block;font-weight:500;color:var(--mute);font-size:.8rem;margin-top:3px}
.coach.ai{border-color:var(--ai);color:#ffd0d8}
.stepper{display:flex;gap:4px;margin-bottom:8px}
.stepper span{flex:1;text-align:center;font-size:.64rem;font-weight:800;padding:5px 2px;border-radius:9px;background:#ffffff0d;color:var(--mute)}
.stepper span.on{background:var(--gold);color:#3a2600}
.stepper span.past{color:var(--you)}
.rq.can{border-color:#f59e0b;background:#fef3c7;animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #fbbf2455}}
.rq.cur{border-color:#0284c7;background:#e0f2fe;box-shadow:0 0 0 3px #38bdf855}
.fb{font-size:.58rem;background:#0284c7;color:#fff;border-radius:6px;padding:2px 5px;letter-spacing:.5px}
.tok{width:auto;height:auto;background:none!important;font-size:.85rem}
.badge{margin:0 6px 4px;font-size:.66rem;font-weight:800;background:#fff7ed;color:#c2410c;border-radius:8px;padding:3px 6px;text-align:center}
.die{flex-direction:column;line-height:1}
.die small{font-size:.48rem;font-weight:800;color:#475569;text-transform:uppercase;margin-top:3px;font-family:Inter}
.die.ok{box-shadow:0 4px 0 #b45309,0 0 0 3px var(--gold),0 0 16px #fbbf2499}
.stop{background:var(--gold);color:#3a2600;box-shadow:0 5px 0 #b45309}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.big small{font-size:.7rem;font-weight:700;opacity:.8;margin-top:2px}
.board.one{grid-template-columns:1fr;max-width:360px;margin:0 auto}
.job.pick{cursor:pointer;box-shadow:0 0 0 3px #fbbf24aa}
.tip{background:#fbbf2418;border:1px solid #fbbf2444;border-radius:12px;padding:8px 10px}
.aitray{border-color:#fb718566}
.meter{flex-wrap:wrap}
.cc{display:grid;gap:6px;margin:10px 0}
.cc div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:.86rem;line-height:1.4;color:#dbe2f7}
.cc b{display:block;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.quiz{border:2px solid #2dd4bf55;border-radius:14px;padding:10px;margin-top:8px}
.qh{font-weight:800;font-size:.8rem;display:flex;justify-content:space-between;gap:6px;color:var(--you)}
.qh span{color:var(--gold)}
.qo{display:grid;gap:6px;margin-top:6px}
.qb{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:11px;font-weight:700;text-align:left;font-size:.92rem}
.qb:hover:not(:disabled){border-color:var(--gold)}
.qb.right{border-color:#22c55e;background:#14532d}
.qb.wrong{border-color:#ef4444;background:#450a0a}
.good{color:#86efac;font-weight:700}.bad{color:#fca5a5;font-weight:700}
.work{background:#0008;border-radius:12px;padding:10px;font-size:.9rem;line-height:1.7}
.mute{color:var(--mute);font-size:.8rem}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 2px}
.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.otag{margin:6px 6px 0;font-size:.68rem;font-weight:800;background:#0f172a;color:#fde68a;border-radius:8px;padding:3px 7px;display:inline-block}
.odesc{font-size:.72rem;color:#475569;padding:0 8px 6px;line-height:1.3}
.learn{background:#2dd4bf14;border:1px solid #2dd4bf44;border-radius:12px;padding:10px;font-size:.86rem;line-height:1.6;margin:10px 0}
.box .btns{display:flex;gap:8px}
.job{background:transparent!important;display:block!important;perspective:1100px;overflow:visible!important;border:none!important;box-shadow:none!important}
.c3{display:grid;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;border-radius:16px;border:3px solid transparent;height:100%}
.c3.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f8fafc;border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
.bk{transform:rotateY(180deg);background:#fffbeb}
.job.focus .c3{border-color:var(--gold);box-shadow:0 0 24px #fbbf2466}
.job.aifocus .c3{border-color:var(--ai);box-shadow:0 0 24px #fb718566}
.job.pick .c3{box-shadow:0 0 0 3px #fbbf24aa;cursor:pointer}
.job.dead .face{opacity:.55}
.job.dead{opacity:1!important}
.fl{font-size:.68rem;font-weight:800;color:#0f172a;background:#e2e8f0;padding:7px;border-top:1px solid #cbd5e1;width:100%}
.fl:hover{background:#fde68a}
.bkb{display:grid;gap:4px;padding:4px 7px 7px;flex:1}
.bkb div{font-size:.68rem;line-height:1.3;color:#334155}
.bkb b{display:block;font-size:.6rem;letter-spacing:.4px;text-transform:uppercase;color:#b45309}
.pkb{position:absolute;top:-7px;right:-7px;font-style:normal;font-size:.8rem;background:#7c3aed;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;box-shadow:0 0 10px #a78bfa}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bar" id="bar"></div>
<div id="modal"></div>
<script>
// ================= DATA =================
const SYM={code:{e:'💻',n:'Code'},data:{e:'📊',n:'Data'},money:{e:'💷',n:'Finance'},people:{e:'🤝',n:'People'},wild:{e:'⭐',n:'Talent'},extra:{e:'🔗',n:'Network'}};
const FACES=['code','data','money','people','wild','extra'];
const FAC={eng:{n:'Engineering',i:'🛠️',c:'#3b82f6'},data:{n:'Data & AI',i:'🧠',c:'#8b5cf6'},cyber:{n:'Cyber',i:'🛡️',c:'#10b981'},bank:{n:'Banking',i:'🏦',c:'#f59e0b'},prod:{n:'Product',i:'📱',c:'#ec4899'}};
const LV=['','Entry','Junior','Senior','Leadership'];

['eng',1,'Junior Developer','Builds and tests small features with support from seniors.',[['code',1],['data',1],['people',1]],['SINGLE','code','Pair programming','A senior helps turn one line of code into something great.']],
['eng',0,'Software Apprentice','Earns while learning to code on real projects.',[['code',1],['people',1],['money',1],['wild',1]],['BUST2',null,'Learning from mistakes','Apprentices come back stronger after something goes wrong.']],
['eng',0,'Front-end Developer','Builds the screens and buttons users actually see.',[['code',2],['people',2],['data',1]],['REROLL',null,'Hot reload','Front-end devs see a change and try again instantly.']],

function riskInfo(){
 const T=G.T,p=P();const n=nextDice();const faces=new Set();
 const add=r=>{if(r.s==='wild')faces.add('wild');else{faces.add(r.s);faces.add('wild');if(has(p,'EXTRA2',r.s))faces.add('extra');}};
 if(T.commit!==null)add(focusReq());else T.card.reqs.filter(isOpen).forEach(add);
 const k=faces.size,pm=(6-k)/6,pb=Math.pow(pm,n);
 const S=stakeNow();
 let Gv;if(T.commit!==null){const r=focusReq();Gv=G.mode==='ladder'?1:rv(r);}else{const o=T.card.reqs.filter(isOpen);Gv=o.length?Math.round(o.reduce((s,r)=>s+rv(r),0)/o.length*10)/10:0;}

}
const fx=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const p1=x=>(Math.round(x*1000)/10).toFixed(1).replace(/\.0$/,'')+'%';
function uniqOpts(correct,cands,fmt){const seen=new Set([fmt(correct)]);const out=[correct];for(const c of cands){const f=fmt(c);if(!seen.has(f)&&isFinite(c)&&c>=0){seen.add(f);out.push(c);}if(out.length===3)break;}return shuffle(out);}
function mathsQuestion(R){
 const L=G.mathLevel,fi=R.faces.map(f=>SYM[f].e).join(' ');
 const box=G.T.commit!==null?`your ${SYM[focusReq().s].e} box`:`a box on ${G.T.card.title}`;
 const need=G.T.commit!==null?[focusReq()]:G.T.card.reqs.filter(isOpen);
 const needTxt=`Your next die must go in ${G.T.commit!==null?'your focus box':'one of the open boxes'}: <b>${[...new Set(need.map(r=>SYM[r.s].e+' '+SYM[r.s].n))].join(', ')}</b>. Remember ⭐ Talent fits any skill box${has(P(),'EXTRA2')?' and your perk lets 🔗 count too':''}.`;
 if(L==='f'){
  const opts=shuffle([...new Set([R.k,Math.max(1,R.k-1),R.k+1,6-R.k].filter(x=>x>=1&&x<=5))]).slice(0,3);if(!opts.includes(R.k))opts[0]=R.k;
  return{q:`${needTxt}<br>On <b>one</b> die, how many of the 6 faces would fit?`,opts:shuffle(opts).map(String),a:String(R.k),
   work:`The faces that fit are ${fi}. That's <b>${R.k} out of 6</b>, so each die has a ${fx(R.k,6)} chance to fit and a ${fx(6-R.k,6)} chance to miss.<br>You'll roll <b>${R.n}</b> ${R.n>1?'dice':'die'}. You only bust if <b>every</b> die misses, which happens about <b>${pct(R.pb)}%</b> of the time.`};
 }
 if(L==='c'){
  const cand=[R.pm,1-R.pb,Math.pow(R.k/6,R.n),Math.min(.99,R.pm/R.n),Math.pow(R.pm,R.n+1)];
  const o=uniqOpts(R.pb,cand,p1);
  return{q:`${fi} fit ${box}, so each die misses with chance ${fx(6-R.k,6)}. You'll roll <b>${R.n}</b> ${R.n>1?'dice':'die'}. What's the chance they <b>all</b> miss (a bust)?`,opts:o.map(p1),a:p1(R.pb),
   work:`Every die has to miss, so multiply: ${Array(R.n).fill(fx(6-R.k,6)).join(' × ')} = (${fx(6-R.k,6)})<sup>${R.n}</sup> = <b>${p1(R.pb)}</b>.<br>Common mistake: ${fx(6-R.k,6)} = ${p1(R.pm)} is the chance for just <b>one</b> die.`};
 }
 const r1=x=>(Math.round(x*10)/10).toString();
 const cand=[R.S+R.G,(1-R.pb)*R.G,R.pb*(R.S+R.G),R.S+(1-R.pb)*R.G];
 const o=uniqOpts(R.ev,cand,r1);
 const better=R.ev>R.S+0.05?'Rolling is worth more <b>on average</b>.':R.ev<R.S-0.05?'Stopping is worth more <b>on average</b>.':'It\'s about even.';

}

const supply=()=>12-G.T.rolling.length-G.T.locked.length;

// ================= RULES ENGINE (focus rule) =================
function allowedCards(){

// ================= ODDS =================
// chance that the NEXT roll busts, given the dice still unlocked
function nextDice(){const T=G.T;return T.rolling.length+Math.min(T.rolling.filter(d=>d.face==='extra').length,supply());}
function bustChance(){
 const T=G.T,p=P();if(!T.card)return null;
 const n=nextDice();if(!n)return null;
 const faces=new Set();
 const add=r=>{if(r.s==='wild')faces.add('wild');else{faces.add(r.s);faces.add('wild');if(has(p,'EXTRA2',r.s))faces.add('extra');}};
 if(T.commit!==null)add(focusReq());else T.card.reqs.filter(isOpen).forEach(add);
 if(!faces.size)return null;
 return Math.pow(1-faces.size/6,n);
}
function stakeNow(){const T=G.T;if(!T.card)return 0;return T.completed.reduce((s,i)=>s+(G.mode==='ladder'?1:rv(T.card.reqs[i])),0);}
function canRollAgain(){const T=G.T;return T.rollNo>0&&!T.done&&T.rolling.length>0&&T.lockedThisRoll>0;}

// ================= AI =================
function aiPickOffer(offers){const sc=c=>-c.reqs.reduce((x,r)=>x+r.n*(r.s==='wild'?1.6:1),0)+(c.ab.t==='START6'?1.5:0)+Math.random();return offers.slice().sort((a,b)=>sc(b)-sc(a))[0];}
function aiChoose(){
 const T=G.T,me=P();let best=null;
 for(const c of allowedCards())c.reqs.forEach((r,i)=>{
  if(!isOpen(r))return;const m=T.rolling.reduce((s,d)=>s+dieVal(d.face,r),0);if(!m)return;
  const others=c.reqs.filter((x,j)=>j!==i&&isOpen(x)).length;
  let sc=(G.mode==='ladder'?2:rv(r))*(m>=r.n?1:.3+.4*m/r.n);
  if(m>=r.n&&!others)sc+=G.mode==='ladder'?6:4+(me.team[c.f]?0:2);
  if(G.mode!=='ladder'&&m>=r.n&&others===1)sc-=1.5; // don't set the opponent up
  sc+=Math.random()*.5;
  if(!best||sc>best.sc)best={c,i,sc};
 });return best;
}
async function aiLock(){
 const T=G.T,r=focusReq(),alive=()=>G.T===T&&!T.done&&T.commit!==null;
 const cand=T.rolling.filter(d=>dieVal(d.face,r)>0);
 const main=cand.filter(d=>d.face!=='wild'||r.s==='wild'),wild=cand.filter(d=>d.face==='wild'&&r.s!=='wild');
 let need=r.n-(T.prog[T.commit]||0),locked=0;
 for(const d of main){if(need<=0||!alive())break;need-=dieVal(d.face,r);await lockDie(d);locked++;await sleep(380);}
 if(!alive()||need<=0)return;
 const k=wild.length>=need?need:(locked?0:1);
 for(const d of wild.slice(0,k)){if(!alive())break;await lockDie(d);await sleep(380);}
}
function aiContinue(){
 if(!canRollAgain())return false;
 const st=stakeNow();if(st===0)return true;
 const pb=bustChance();if(pb===null)return false;
 let th=G.mode==='ladder'?(st>=2?.2:.3):(st>=6?.14:st>=3?.22:.32);
 if(G.mode!=='ladder'&&G.players[1-G.cur].rep-P().rep>8)th+=.1;
 if(G.mode==='ladder'&&G.players[1-G.cur].rung>P().rung)th+=.1;
 return pb<th;
}
async function aiTurn(){
 const T=G.T,alive=()=>G.T===T&&!T.done&&!G.over;
 while(document.getElementById('modal').innerHTML)await sleep(300);
 await sleep(900);
 while(alive()){
  if(T.rollNo===0){T.aiMsg='is rolling…';await doRoll();await sleep(800);continue;}
  if(!T.mustRoll&&T.lockedThisRoll===0){
   if(T.commit===null){const ch=aiChoose();if(!ch){await bust();break;}commit(ch.c,ch.i);const r=ch.c.reqs[ch.i];T.aiMsg=`picked ${SYM[r.s].e.repeat(r.n)} on ${ch.c.title}`;render();await sleep(900);}
   T.aiMsg='is adding dice…';await aiLock();if(alive()&&T.lockedThisRoll===0&&!T.mustRoll){await bust();break;}await sleep(700);continue;
  }
  if(aiContinue()){T.aiMsg='rolls again!';render();await sleep(600);await doRoll();await sleep(800);}else{T.aiMsg='stops.';await stopTurn();}
 }
}

// ================= UI =================
const mine=()=>G&&!G.over&&!P().ai&&!G.T.done;
const UI={
 roll(){if(!mine()||busy)return;const T=G.T;
  if(G.mode==='maths'&&T.rollNo&&canRollAgain()&&!T.answered&&stakeNow()>0&&(T.mq||0)<3)return mathsPrompt();
  if(G.mode==='ladder'&&!T.card){mini('Choose a job first');return shake(document.querySelector('.offers'));}
  if(T.rollNo&&!canRollAgain()){mini(T.rolling.length?'Put at least one die in your box first':'No dice left: stop to keep your boxes');return shake(document.querySelector('.roll'));}
  doRoll();},
 stop(){if(!mine()||busy||!G.T.rollNo)return;stopTurn();},
 req(id,i,ev){if(!mine()||busy)return;
  const c=(G.mode==='ladder'?[G.T.card]:G.market).find(x=>x&&x.id===id);if(!c)return;ev.stopPropagation();const T=G.T;
  if(!T.rollNo){mini('Roll the dice first');return shake(ev.currentTarget);}
  if(canCommit(c,i))return commit(c,i);
  shake(ev.currentTarget);
  mini(T.mustRoll?'Roll again first, or stop':!isOpen(c.reqs[i])?'That box is already full':T.commit!==null?'Fill your focus box first':!allowedCards().includes(c)?'Stick with the same job this turn':'None of your dice fit that box');
 },
 die(id,ev){if(!mine()||busy)return;const T=G.T;const d=T.rolling.find(x=>x.id===id);if(!d)return;
  if(T.commit===null){mini(T.mustRoll?'Roll again first, or stop':'Pick a skill box first');return shake(ev.currentTarget);}
  if(!dieVal(d.face,focusReq())){mini(`That die doesn't fit your ${SYM[focusReq().s].e} box`);return shake(ev.currentTarget);}
  lockDie(d);
 },
 offer(i){if(!mine()||busy)return;const p=P();if(!p.offers)return;p.job=p.offers[i];p.offers=null;G.T.card=p.job;sfx('tap');render();},
 info(id,ev){ev&&ev.stopPropagation();const all=[...(G.market||[]),...G.players.flatMap(p=>[p.job,...(p.offers||[]),...p.history,...Object.values(p.team).flat()])].filter(Boolean);const c=all.find(x=>x.id===id);if(!c)return;
  modal(`<div style="color:${FAC[c.f].c};font-weight:800;font-size:.75rem">${FAC[c.f].i} ${FAC[c.f].n.toUpperCase()} · ${LV[lvl(c)].toUpperCase()} LEVEL</div><h2>${c.title}</h2><p>${c.desc}</p><div class="cc"><div><b>🧩 Skills</b>${skillMix(c)}</div><div><b>🎓 How people get in</b>${careerOf(c)[0]}</div><div><b>📚 Useful subjects</b>${careerOf(c)[1]}</div></div><p style="margin-top:12px"><b>⚡ Perk: ${c.ab.name}</b><br>${perkLong(c.ab)}</p><p style="color:var(--mute);font-style:italic">Why? ${c.ab.why}</p><button class="go" onclick="closeModal()">Got it</button>`);},
 team(i){const p=G.players[i];const list=G.mode==='ladder'?p.history:Object.values(p.team).flat();
  modal(`<h2>${i?'🤖 Rival\'s':'Your'} ${G.mode==='ladder'?'career':'team'}</h2>${list.length?list.map(c=>`<p><span class="chip" style="background:${FAC[c.f].c}">${FAC[c.f].i} ${c.title}</span><br><b>⚡ ${c.ab.name}</b>: ${perkLong(c.ab)}</p>`).join(''):'<p>Nobody yet.</p>'}${G.mode!=='ladder'?'<p style="font-size:.8rem;color:var(--mute)">Only the newest person in each sector uses their perk.</p>':''}<button class="go" onclick="closeModal()">Close</button>`);},
 menu(){modal(`<h2>Menu</h2><button class="go" onclick="showRules('${G.mode}',true)">📖 How to play</button><button class="ghost" style="width:100%;margin-top:8px" onclick="startGame('${G.mode}')">🔄 Restart</button><button class="ghost" style="width:100%;margin-top:8px" onclick="showModes()">🎮 Change mode</button><button class="ghost" style="width:100%;margin-top:8px" onclick="soundOn=!soundOn;UI.menu()">${soundOn?'🔊 Sound on':'🔇 Sound off'}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Close</button>`);}
};

// ---------- coach ----------
function coach(){
 const T=G.T,p=P();
 if(G.over)return{step:0,t:'Game over!'};
 if(p.ai){return{step:0,t:T.iv?'🤖 Rival is in an interview…':`🤖 Rival ${T.aiMsg||'is thinking…'}`,ai:true};}
 if(T.done)return{step:0,t:'…'};
 if(G.mode==='ladder'&&!T.card)return{step:0,t:`Choose your next job (${LV[p.rung+1]} level).`};
 if(T.iv)return{step:0,t:'🎤 Interview time!'};
 if(busy)return{step:1,t:'Rolling…'};
 if(!T.rollNo)return{step:1,t:`Your turn! Roll ${Math.min(12,5+(has(p,'START6')?1:0)+p.bonus)} dice.`,s:p.bonus?'⚡ You have a bonus die this turn.':''};
 if(T.mustRoll){const n=nextDice();return{step:4,t:'✅ Box filled! Stop to keep it, or roll again to fill another box on this job.',s:n?`Next roll you must start a new box on ${T.card.title}.`:'You have no dice left, so stop now.'};}
 if(T.commit===null)return{step:2,t:T.completed.length||T.locked.length?`Pick another box on ${T.card.title}.`:'Pick a skill box on a job. This is your focus.',s:hints()?'Glowing boxes match your dice.':''};
 const r=focusReq(),need=r.n-(T.prog[T.commit]||0);
 if(!T.lockedThisRoll)return{step:3,t:`Tap dice to put them in your ${SYM[r.s].e} box.`,s:`You must add at least one. ${need} more to fill it.`+(T.locked.length?'':' (You can still pick a different box.)')};
 if(G.mode==='maths'&&stakeNow()>0&&!T.answered)return{step:4,t:`${need} more ${SYM[r.s].e} needed. Add more dice, or roll again?`,s:'You have points at risk, so pressing Roll gives you a maths question first.'};
 return{step:4,t:`${need} more ${SYM[r.s].e} needed. Add more dice, or roll again?`,s:hints()?'Every die you add means one fewer to roll. Watch the meter!':'Every die you add means one fewer to roll.'};
}

// ---------- rendering ----------
function stars(c){const L=lvl(c);return `<span class="stars">${'★'.repeat(L)}<i>${'★'.repeat(4-L)}</i></span>`;}
function reqHtml(c,r,i){
 const T=G.T,onTurn=T.card===c,me=!P().ai&&!G.over&&!busy;
 const prog=onTurn&&isOpen(r)?Math.min(r.n,T.prog[i]||0):0;
 let cls='rq tap';if(!isOpen(r))cls+=' o'+r.owner;
 if(onTurn&&T.commit===i)cls+=' cur';
 else if(hints()&&me&&canCommit(c,i))cls+=' can';
 const ic=Array.from({length:r.n},(_,k)=>`<span class="${k<prog?'f':''}">${SYM[r.s].e}</span>`).join('');
 const right=!isOpen(r)?`<span class="tok p${r.owner}">${r.owner?'🤖':'🧑'}</span>`:onTurn&&T.commit===i?'<span class="fb">FOCUS</span>':'';
 return `<div class="${cls}" onclick="UI.req(${c.id},${i},event)"><span class="ic">${ic}</span><span class="v">${G.mode!=='ladder'?`${rv(r)}🏆`:''}${right}</span></div>`;
}
function jobHtml(c,extra='',click=''){
 const open=c.reqs.filter(isOpen).length;
 const badge=open===1&&c.reqs.length>1?`<div class="badge">🎤 1 box left, then the interview!</div>`:'';
 const [route,subj]=careerOf(c),nx=nextSteps(c),on=G.flipped&&G.flipped.has(c.id);
 const hd=`<div class="hd"><span>${FAC[c.f].i} ${FAC[c.f].n}</span>${stars(c)}</div>`;
 return `<div class="job ${extra}" data-jid="${c.id}" style="--c:${FAC[c.f].c}" ${click}><div class="c3 ${on?'on':''}">
 <div class="face fr">${hd}${c.tag?`<div class="otag">${c.tag}</div>`:''}<div class="tt">${c.title}</div>${c.tag?`<div class="odesc">${c.desc}</div>`:''}${badge}<div class="rqs">${c.reqs.map((r,i)=>reqHtml(c,r,i)).join('')}</div><div class="perk" onclick="UI.info(${c.id},event)">⚡ ${c.ab.name}: ${perkShort(c.ab)} <span>ⓘ</span></div><button class="fl" onclick="flipCard(${c.id},event)">🔄 Job details</button></div>
 <div class="face bk">${hd}<div class="tt">${c.title}</div><div class="bkb"><div><b>💼 The job</b>${c.desc}</div><div><b>🧩 Skills</b>${skillMix(c)}</div><div><b>🎓 How to get in</b>${route}</div><div><b>📚 Subjects</b>${subj}</div><div><b>↗ Next step</b>${nx.length?nx.map(x=>x.title).join(' or '):'Top of the ladder!'}</div></div><button class="fl" onclick="flipCard(${c.id},event)">🔄 Back to the boxes</button></div>
 </div></div>`;
}
function render(){
 if(!G)return;const T=G.T,p=P(),app=document.getElementById('app'),human=!p.ai&&!G.over;
 const C=coach();
 const pills=G.players.map((q,i)=>{
  let inner;
  if(G.mode==='ladder')inner=`<div class="ladder">${[0,1,2,3].map(k=>`<div class="rung ${k<q.rung?'done p'+i:k===q.rung?'cur':''}"></div>`).join('')}</div><div class="rlab">${q.rung?q.history[q.rung-1].title:'Starting out'}${q.perks.length?` · ⚡${q.perks.length}`:''}</div>`;
  else inner=`<div class="secs">${Object.keys(FAC).map(f=>{const n=(q.team[f]||[]).length;return `<span class="sec ${n?'got':''}" style="${n?`background:${FAC[f].c}`:''}">${FAC[f].i}${n>1?`<b>${n}</b>`:''}</span>`;}).join('')}</div>`;
  return `<button class="pill p${i} ${G.cur===i&&!G.over?'on':''}" onclick="UI.team(${i})"><div class="row"><span class="nm">${i?'🤖 Rival':'🧑 You'}</span>${G.mode!=='ladder'?`<span class="pts">${q.rep}<small>🏆</small></span>`:`<span class="pts" style="font-size:.95rem">${LV[Math.min(q.rung+1,4)]}</span>`}</div>${inner}</button>`;
 }).join('');
 const stepNames=['Roll','Pick a box','Add dice','Roll or stop?'];
 const steps=hints()&&!p.ai&&!G.over&&C.step?`<div class="stepper">${stepNames.map((s,k)=>`<span class="${C.step===k+1?'on':C.step>k+1?'past':''}">${k+1}. ${s}</span>`).join('')}</div>`:'';
 // dice tray
 const r=focusReq();
 const dieH=d=>{let cls='die tap';if(d.fresh)cls+=' tumble';
  if(hints()&&human&&!busy&&r){cls+=dieVal(d.face,r)?' ok':' dim';}
  const pk=human&&r&&perkFor(d.face,r);
  return `<button class="${cls}" onclick="UI.die(${d.id},event)">${pk?'<i class="pkb">⚡</i>':''}${SYM[d.face].e}<small>${pk?(d.face==='extra'?'counts ×2':'counts ⭐'):SYM[d.face].n}</small></button>`;};
 const tray=`<div class="tray ${p.ai?'aitray':''}"><div class="lbl"><span>${p.ai?'🤖 Rival\'s dice':'🎲 Your dice'}</span><span>${supply()} left in the bag</span></div>
  <div class="dice">${T.rolling.length?T.rolling.map(dieH).join(''):`<span class="empty">${T.rollNo?'No dice left to roll':'Press Roll to start'}</span>`}</div>
  ${T.locked.length?`<div class="lbl"><span>In boxes this turn</span><span>${T.completed.length?`✅ ${T.completed.length} box${T.completed.length>1?'es':''} filled`:''}</span></div><div class="locked">${T.locked.map(d=>`<span class="die sm">${SYM[d.face].e}</span>`).join('')}</div>`:''}</div>`;
 // board
 let board='';
 if(G.mode==='ladder'){
  const you=G.players[0],riv=G.players[1];
  if(you.offers&&!p.ai)board=`<div class="offers"><div class="oh">Tap a job to go for it</div>${you.offers.map((c,i)=>jobHtml(c,'pick',`onclick="UI.offer(${i})"`)).join('')}</div>`;
  else{const show=p.ai?riv.job:you.job;board=show?`<div class="board one">${jobHtml(show,p.ai?'aifocus':'focus')}</div>`:'';}
  const other=p.ai?you:riv;
  if(other.job)board+=`<div class="rival"><span>${p.ai?'🧑 Your job':'🤖 Rival\'s job'}: <b style="color:var(--ink)">${other.job.title}</b></span><span class="mini">${other.job.reqs.map(q=>`<span class="${!isOpen(q)?'o1':''}">${SYM[q.s].e}${q.n}${!isOpen(q)?'✓':''}</span>`).join('')}</span></div>`;
 }else{
  const allowed=allowedCards();
  board=`<div class="board m4">${G.market.map(c=>{let cls='';
   if(T.card===c&&(T.commit!==null||T.locked.length||T.completed.length))cls=p.ai?'aifocus':'focus';
   else if(T.rollNo&&!allowed.includes(c))cls='dead';
   return jobHtml(c,cls);}).join('')}</div>`;
 }
 app.innerHTML=`<div class="top"><div class="logo">Hired<span>!</span><span class="mode">${MODES[G.mode].e} ${MODES[G.mode].n}</span></div><div style="display:flex;gap:6px"><button class="ib" onclick="showRules('${G.mode}',true)">?</button><button class="ib" onclick="UI.menu()">☰</button></div></div>
 <div class="scores">${pills}</div>
 <div class="coach ${C.ai?'ai':''}">${C.t}${C.s?`<small>${C.s}</small>`:''}</div>${steps}
 ${G.mode==='ladder'&&!T.card?'':tray}${board}
 <div class="ticker">${G.tick.map(t=>`<div>${t}</div>`).join('')}</div>`;
 T.rolling.forEach(d=>d.fresh=false);
 // action bar
 let meter='';
 const st=stakeNow(),unit=G.mode==='ladder'?' box':' 🏆';
 if(human&&T.rollNo&&!T.done&&T.card&&hints()&&(G.mode!=='maths'||T.answered)){
  const pb=bustChance();
  if(pb!==null&&nextDice()){const pc=pct(pb),col=pc<20?'#22c55e':pc<40?'#eab308':'#ef4444';const lab=pc<20?'Safe-ish':pc<40?'Risky':'Very risky';
   meter=`<div class="meter"><span>If you roll again:</span><div class="track"><div class="fill" style="width:${Math.max(3,pc)}%;background:${col}"></div></div><span style="color:${col}">${pc}% bust · ${lab}</span></div>`;}
 }
 const first=!T.rollNo;
 const rollOk=human&&!busy&&!T.done&&(first?(G.mode!=='ladder'||!!T.card):canRollAgain());
 const stopOk=human&&!busy&&!T.done&&T.rollNo>0;
 const n=first?Math.min(12,5+(has(p,'START6')?1:0)+p.bonus):nextDice();
 const risk=!first&&st?`<small>risking ${st}${unit}${st>1&&G.mode==='ladder'?'es':''}</small>`:!first&&hints()?'<small>nothing to lose yet</small>':'';
 const partial=T.commit!==null&&(T.prog[T.commit]||0)>0;
 const stopSub=st?`<small>keep ${st}${unit}${st>1&&G.mode==='ladder'?'es':''}${partial?' (half-filled box is lost)':''}</small>`:'<small>end turn</small>';
 document.getElementById('bar').innerHTML=G.over?'':`<div class="in">${meter}<div class="btns"><button class="big roll" onclick="UI.roll()" ${rollOk?'':'disabled'}>🎲 Roll ${n} ${n===1?'die':'dice'}${risk}</button><button class="big stop" onclick="UI.stop()" ${stopOk?'':'disabled'}>✋ Stop${stopSub}</button></div></div>`;
}
showModes();

</script>
